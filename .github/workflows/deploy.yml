name: deploy

# Builds the Vite site and publishes it to GitHub Pages.
# Runs on pushes to main, by hand, and is called by daily.yml after the data refresh
# (pushes made with GITHUB_TOKEN don't trigger other workflows).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # when called from daily.yml, pick up the data commit it just pushed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish reviewed texts only
        run: |
          pip install PyYAML==6.0.4
          python -m pipeline.export --texts-only
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
