name: deploy

# Builds the Vite site and publishes it to GitHub Pages.
# Runs on pushes to main, by hand, every day, and is called by daily.yml / news.yml
# (pushes made with GITHUB_TOKEN don't trigger other workflows; callers pass `secrets: inherit`).
# The daily run matters: the Guardian's terms allow keeping article text for 24 hours at
# most, so guardian.json is re-downloaded on every build and never committed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"   # every day, including weekends
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # when called from daily.yml, pick up the data commit it just pushed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish reviewed texts only
        run: |
          pip install PyYAML==6.0.4 requests==2.34.2
          python -m pipeline.export --texts-only
      - name: Guardian article text (kept < 24 h, never committed)
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: python -m pipeline.fetch_guardian
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
